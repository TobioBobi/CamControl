name: Build and tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga

      - name: Build Debug
        run: dotnet build CamControl.sln -c Debug

      - name: Build Release
        run: dotnet build CamControl.sln -c Release

      # These checks are console programs, so dotnet test would not execute them.
      - name: Check settings and camera service
        run: dotnet run --project Tests/SettingsCheck/SettingsCheck.csproj -c Release

      - name: Check camera UI
        run: dotnet run --project Tests/CameraUiCheck/CameraUiCheck.csproj -c Release

      - name: Build self-contained MSIX test package
        shell: pwsh
        run: ./packaging/Build-Msix.ps1

      - name: Upload unsigned MSIX test package
        uses: actions/upload-artifact@v7
        with:
          name: CamControl-msix-test-x64
          path: artifacts/msix/test/x64/*.msix
          if-no-files-found: error
          compression-level: 0
